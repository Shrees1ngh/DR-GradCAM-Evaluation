# ==============================================================================
# Central Configuration: DR-GradCAM-Evaluation
# Project: Evaluating Grad-CAM Explanations for Diabetic Retinopathy Grading
# ==============================================================================

project:
  name: "DR-GradCAM-Evaluation"
  version: "0.1.0"
  random_seed: 42

# ------------------------------------------------------------------------------
# Dataset Paths & Structure (IDRiD)
# ------------------------------------------------------------------------------
dataset:
  raw_dir: "data/raw/IDRiD"
  processed_dir: "data/processed"
  
  # Disease Grading (516 images: 413 Train + 103 Test)
  disease_grading:
    train_images_dir: "data/raw/IDRiD/B. Disease Grading/B. Disease Grading/1. Original Images/a. Training Set"
    test_images_dir: "data/raw/IDRiD/B. Disease Grading/B. Disease Grading/1. Original Images/b. Testing Set"
    train_labels_file: "data/raw/IDRiD/B. Disease Grading/B. Disease Grading/2. Groundtruths/a. IDRiD_Disease Grading_Training Labels.csv"
    test_labels_file: "data/raw/IDRiD/B. Disease Grading/B. Disease Grading/2. Groundtruths/b. IDRiD_Disease Grading_Testing Labels.csv"
    
    # Column mapping in IDRiD CSVs
    image_id_col: "Image name"
    grade_col: "Retinopathy grade"
    dme_col: "Risk of macular edema "

  # Segmentation (81 images with pixel-level lesion annotations: 54 Train + 27 Test)
  segmentation:
    images_dir: "data/raw/IDRiD/A. Segmentation/A. Segmentation/1. Original Images"
    train_images_dir: "data/raw/IDRiD/A. Segmentation/A. Segmentation/1. Original Images/a. Training Set"
    test_images_dir: "data/raw/IDRiD/A. Segmentation/A. Segmentation/1. Original Images/b. Testing Set"
    masks_root_dir: "data/raw/IDRiD/A. Segmentation/A. Segmentation/2. All Segmentation Groundtruths"
    train_masks_dir: "data/raw/IDRiD/A. Segmentation/A. Segmentation/2. All Segmentation Groundtruths/a. Training Set"
    test_masks_dir: "data/raw/IDRiD/A. Segmentation/A. Segmentation/2. All Segmentation Groundtruths/b. Testing Set"
    
    lesion_types:
      microaneurysms:
        code: "MA"
        subdir: "1. Microaneurysms"
      haemorrhages:
        code: "HE"
        subdir: "2. Haemorrhages"
      hard_exudates:
        code: "EX"
        subdir: "3. Hard Exudates"
      soft_exudates:
        code: "SE"
        subdir: "4. Soft Exudates"
      optic_disc:
        code: "OD"
        subdir: "5. Optic Disc"

  # APTOS 2019 Blindness Detection Dataset (3,662 images)
  aptos:
    raw_dir: "data/raw/APTOS"
    images_dir: "data/raw/APTOS/train_images"
    labels_file: "data/raw/APTOS/train.csv"
    image_id_col: "id_code"
    grade_col: "diagnosis"

# ------------------------------------------------------------------------------
# Image Preprocessing & Augmentation
# ------------------------------------------------------------------------------
preprocessing:
  image_size: [512, 512]
  crop_black_borders: true
  circular_fov_mask: true
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

  # Clinical and scientific rationale for fundus data augmentation (training split ONLY):
  # - horizontal_flip: Retinal fundus photographs maintain biological validity under horizontal
  #   reflection. While optic disc and macula switch lateral positions (simulating OD vs OS eyes),
  #   diabetic lesions (microaneurysms, hemorrhages, exudates) are orientation-invariant.
  # - vertical_flip: Disabled by default (p=0.0). Retinal fundus imaging follows a canonical vertical
  #   orientation where the superior and inferior vascular arcades occupy distinct anatomical hemispheres.
  #   Vertical inversion introduces anatomically atypical inverted orientations not encountered in clinical practice.
  #   Retained as a configurable parameter for future ablation studies.
  # - rotation: Minor angular deviations (±15 degrees) reflect head tilt during acquisition; prevents
  #   the network from memorizing rotational artifacts while preserving the circular FOV boundary.
  # - color_jitter: Models illumination and contrast variations arising from different fundus camera
  #   flash intensities, sensor color responses, pupil dilation states, and mild media opacities
  #   (e.g., incipient cataract), without altering key diagnostic chromatic cues (red lesions vs yellow exudates).
  augmentation:
    horizontal_flip_prob: 0.5
    vertical_flip_prob: 0.0
    rotation_degrees: 15.0
    brightness_jitter: 0.1
    contrast_jitter: 0.1

# ------------------------------------------------------------------------------
# CNN Model Specifications
# ------------------------------------------------------------------------------
model:
  backbone: "resnet50"             # Primary: resnet50; Secondary: efficientnet_b0
  pretrained: true
  num_classes: 5                  # ICDR Grades 0, 1, 2, 3, 4
  dropout_rate: 0.3
  target_conv_layer: "layer4"     # ResNet-50 final convolutional block

# ------------------------------------------------------------------------------
# Model Training Hyperparameters (Phase 3)
# ------------------------------------------------------------------------------
training:
  batch_size: 8                   # Default mini-batch size (suitable for Tesla T4 GPU 16GB at 512x512)
  epochs: 25
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"             # CosineAnnealingLR or ReduceLROnPlateau
  patience: 5                     # Early stopping patience based on validation QWK
  min_delta: 0.001
  mixed_precision: true           # FP16 autocast when CUDA is available
  class_weighted_loss: true       # Inversely weighted CrossEntropyLoss for class imbalance
  num_workers: 0                  # Worker count for DataLoader (0 for Windows compatibility)
  checkpoint_metric: "val_qwk"

# ------------------------------------------------------------------------------
# Explainability (Grad-CAM)
# ------------------------------------------------------------------------------
explainability:
  method: "Grad-CAM"
  percentile_thresholds: [0.05, 0.10, 0.20]   # Top 5%, 10%, 20% salient activation cuts
  baseline_threshold: 0.10                    # Primary reporting cutoff (top 10%)

# ------------------------------------------------------------------------------
# Faithfulness (Deletion Test)
# ------------------------------------------------------------------------------
faithfulness:
  deletion_steps: [0.10, 0.20, 0.30]          # Progressive salient deletion percentages
  fill_strategies:
    - "black"                                 # Primary (0, 0, 0)
    - "gaussian_blur"                         # Neutral control for OOD edge boundary check
  random_control:
    enabled: true
    num_random_trials: 5                      # Number of random baseline masks per step

# ------------------------------------------------------------------------------
# Statistical Analysis & Reproducibility
# ------------------------------------------------------------------------------
statistics:
  correlation_metric: "spearman"
  bootstrap_iterations: 1000
  confidence_level: 0.95
  min_samples_per_grade: 5                    # Minimum N to report grade-wise correlation

# ------------------------------------------------------------------------------
# Output Directories
# ------------------------------------------------------------------------------
outputs:
  reports_dir: "reports"
  checkpoints_dir: "experiments/checkpoints"
  visualizations_dir: "experiments/visualizations"
